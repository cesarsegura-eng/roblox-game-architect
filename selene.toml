# Selene doesn't bundle the Roblox API library. Keep the generated definitions
# checked in so linting stays deterministic and works without network access.
# Regenerate with `selene generate-roblox-std` when intentionally updating the
# Roblox engine API baseline; review the diff before committing it.
std = "roblox"
roblox-std-source = "pinned"

[rules]
# The plugin is the most privileged component in the system, so lint findings
# there are errors rather than suggestions (ADR-0005).
incorrect_standard_library_use = "deny"
undefined_variable = "deny"
unused_variable = "warn"
shadowing = "warn"
